<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clicker</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <h1>Clicker Game</h1>

    <button id="login">Login com Google</button>

    <p id="status-login">Nao logado</p>

    <div class="contador-card">
        <h2>Pontos</h2>

        <div class="display">
            <span id="contador-cookie">0</span>
        </div>

        <p id="cps">0 clicks por segundo</p>

        <img src="./img/cookie.png" id="btn-clique-cookie">
    </div>

    <h2>Upgrades</h2>

    <div class="upgrade">
        <button id="upgradeClique">+1 Clique (50)</button>
        <button id="upgradeAuto">Auto Click (100)</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
